name: Arrakis
description: 'Arrakis Therapeutics is a biopharmaceutical company pioneering
  RNA-targeted small molecules (rSMs) as a new class of genetic medicines. Its rSM
  platform enables orally available small molecules to bind RNA and modulate previously
  undruggable biological pathways, with an industrialized discovery toolkit spanning
  multiple modalities. The lead proprietary program targets Type 1 Myotonic Dystrophy
  (DM1) at the root cause of the disease, alongside a pipeline of proprietary and
  partnered programs. A GV (Google Ventures) portfolio company in the life-sciences
  sector, Arrakis was added to the API Evangelist network as a company profile; it
  publishes a corporate and scientific website but no public developer API surface.'
